<path class="arrow" d="M522 112 H568"/>
<rect class="box" x="574" y="55" width="218" height="115"/><text x="592" y="94">Роли и кластеры</text><text class="small" x="592" y="123">пороговые правила</text><text class="small" x="592" y="145">Louvain · приоритет</text>
<path class="arrow" d="M797 112 H843"/>
<rect class="box" x="849" y="55" width="230" height="115"/><text x="867" y="94">CSV и HTML</text><text class="small" x="867" y="123">топ-лист · доказательства</text><text class="small" x="867" y="145">поиск gid · схема сети</text>
</svg>
